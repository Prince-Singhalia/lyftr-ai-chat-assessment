services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
    env_file:
      - path: .env
        required: false
    volumes: [app_data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('PORT','8000') + '/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_started
volumes:
  app_data:

